# .github/workflows/ci_spm.yml
name: CI – SPM

on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: swift build
        run: swift build -c release
